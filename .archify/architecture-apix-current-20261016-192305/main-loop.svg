<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1000" role="img" aria-labelledby="loop-title loop-desc"><title id="loop-title">ApiX 主 Agent loop</title><desc id="loop-desc">主循环反复观察、推理、执行工具并读取真实结果；可等待用户或委派子流程，完成须验证，异常须检查恢复。</desc><defs><marker id="loop-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#80b3e8"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif} .node rect{fill:#16243a;stroke:#3b5576;stroke-width:1.5}.node .title{fill:#eff6ff;font-size:17px;font-weight:600}.node .detail{fill:#b4c5db;font-size:12px}.node.gate rect{fill:#2b2542;stroke:#8778bd}.node.wait rect{fill:#302b1b;stroke:#ad924e}.node.done rect{fill:#14382f;stroke:#57a28b}.node.error rect{fill:#3b222e;stroke:#c7768f}.link{stroke:#80b3e8;stroke-width:2;fill:none;marker-end:url(#loop-arrow)}.link.branch{stroke:#c4a464;stroke-dasharray:6 4}.link.back{stroke:#6ec4ae;stroke-dasharray:7 4}.edge-label{fill:#d3e5fb;font-size:12px;paint-order:stroke;stroke:#0d1728;stroke-width:6px;stroke-linejoin:round}.foot{fill:#9eb3cd;font-size:12px}</style><rect width="1120" height="1000" fill="#0d1728"/><path class="link " d="M540 120 V160"/><path class="link " d="M540 240 V280"/><path class="link " d="M540 360 V420"/><text class="edge-label" text-anchor="middle" x="640" y="394">tool 且已获准</text><path class="link " d="M540 500 V580"/><text class="edge-label" text-anchor="middle" x="628" y="546">普通工具结果</text><path class="link back" d="M400 620 H20 V80 H400"/><text class="edge-label" text-anchor="middle" x="184" y="606">下一步：重新观察</text><path class="link branch" d="M400 320 H320"/><text class="edge-label" text-anchor="middle" x="360" y="309">询问</text><path class="link back" d="M180 280 V230 H350 V80 H400"/><text class="edge-label" text-anchor="middle" x="260" y="218">选择 / 拒绝</text><path class="link branch" d="M180 360 V460 H400"/><text class="edge-label" text-anchor="middle" x="268" y="449">批准绑定参数的工具</text><path class="link " d="M680 460 H800"/><text class="edge-label" text-anchor="middle" x="740" y="449">delegate</text><path class="link back" d="M940 500 V620 H680"/><text class="edge-label" text-anchor="middle" x="899" y="649">子流程全部验收，唤醒主循环</text><path class="link " d="M680 320 H740 V200 H800"/><text class="edge-label" text-anchor="middle" x="782" y="280">finish + 证据有效</text><path class="link branch" d="M1080 460 H1100 V840 H1080"/><text class="edge-label" text-anchor="middle" x="1060" y="752">阻塞</text><g class="node " id="loop-context"><title>src/assistant-loop.ts:79–88</title><rect x="400" y="40" width="280" height="80" rx="12"/><text x="540" y="72" text-anchor="middle" class="title">观察与重建上下文</text><text x="540" y="97" text-anchor="middle" class="detail">历史、摘要、初始/最新需求、记忆与规则</text></g><g class="node " id="loop-infer"><title>src/assistant-loop.ts:90–111</title><rect x="400" y="160" width="280" height="80" rx="12"/><text x="540" y="192" text-anchor="middle" class="title">独立模型 API 推理</text><text x="540" y="217" text-anchor="middle" class="detail">结构化 JSON：tool / ask / finish</text></g><g class="node gate" id="loop-decision"><title>src/assistant-loop.ts:53–61</title><rect x="400" y="280" width="280" height="80" rx="12"/><text x="540" y="312" text-anchor="middle" class="title">动作与权限校验</text><text x="540" y="337" text-anchor="middle" class="detail">白名单、只读、拒绝记录、项目状态</text></g><g class="node " id="loop-tool"><title>control-plane.mjs:1270–1310</title><rect x="400" y="420" width="280" height="80" rx="12"/><text x="540" y="452" text-anchor="middle" class="title">宿主执行指定工具</text><text x="540" y="477" text-anchor="middle" class="detail">文件、命令、验证、Skill、记忆、委派</text></g><g class="node " id="loop-result"><title>src/assistant-loop.ts:66–77,103–107</title><rect x="400" y="580" width="280" height="80" rx="12"/><text x="540" y="612" text-anchor="middle" class="title">记录真实结果与验证证据</text><text x="540" y="637" text-anchor="middle" class="detail">普通错误可继续；完成证据不足继续观察</text></g><g class="node wait" id="loop-user"><title>src/assistant-loop.ts:99–101,115–120</title><rect x="40" y="280" width="280" height="80" rx="12"/><text x="180" y="312" text-anchor="middle" class="title">waiting_user</text><text x="180" y="337" text-anchor="middle" class="detail">问题选择 / 明确批准；校验版本与指纹</text></g><g class="node wait" id="loop-agents"><title>src/assistant-loop.ts:75,124–126</title><rect x="800" y="420" width="280" height="80" rx="12"/><text x="940" y="452" text-anchor="middle" class="title">waiting_agents</text><text x="940" y="477" text-anchor="middle" class="detail">主循环暂停；每秒检查子流程完成/阻塞</text></g><g class="node done" id="loop-finish"><title>src/assistant-loop.ts:103–107</title><rect x="800" y="160" width="280" height="80" rx="12"/><text x="940" y="192" text-anchor="middle" class="title">completed：答复本轮</text><text x="940" y="217" text-anchor="middle" class="detail">有写入或命令时，须当前指纹 verify 成功</text></g><g class="node error" id="loop-attention"><title>src/assistant-loop.ts:122–125</title><rect x="800" y="800" width="280" height="80" rx="12"/><text x="940" y="832" text-anchor="middle" class="title">attention / stopped</text><text x="940" y="857" text-anchor="middle" class="detail">检查后明确恢复；有子会话则先等待子流程</text></g><text class="foot" x="40" y="934">实线：主要调用；虚线：选择、批准、回传或异常分支。源码位置可悬停节点查看。</text><text class="foot" x="40" y="954">主循环有真实 while；每轮最多 24 步或 30 分钟。任意阶段的错误、finish blocked 或超限可进入 attention。</text><text class="foot" x="40" y="974">等待员工时由独立调度/监督推进。停止或重启后不自动重放未确认副作用。</text></svg>