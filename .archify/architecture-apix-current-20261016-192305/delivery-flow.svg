<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 1110" role="img" aria-labelledby="flow-title flow-desc"><title id="flow-title">ApiX 复杂任务协作与交付流程</title><desc id="flow-desc">先冻结架构与契约，再按能力与成本路由，通过依赖队列执行、实际测试和自审；失败时有界修复，再次验收。</desc><defs><marker id="flow-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#80b3e8"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC',sans-serif} .node rect{fill:#16243a;stroke:#3b5576;stroke-width:1.5}.node .title{fill:#eff6ff;font-size:17px;font-weight:600}.node .detail{fill:#b4c5db;font-size:12px}.node.gate rect{fill:#2b2542;stroke:#8778bd}.node.wait rect{fill:#302b1b;stroke:#ad924e}.node.done rect{fill:#14382f;stroke:#57a28b}.node.error rect{fill:#3b222e;stroke:#c7768f}.link{stroke:#80b3e8;stroke-width:2;fill:none;marker-end:url(#flow-arrow)}.link.branch{stroke:#c4a464;stroke-dasharray:6 4}.link.back{stroke:#6ec4ae;stroke-dasharray:7 4}.edge-label{fill:#d3e5fb;font-size:12px;paint-order:stroke;stroke:#0d1728;stroke-width:6px;stroke-linejoin:round}.foot{fill:#9eb3cd;font-size:12px}</style><rect width="1120" height="1110" fill="#0d1728"/><path class="link " d="M540 120 V160"/><path class="link " d="M540 240 V280"/><path class="link " d="M540 360 V400"/><path class="link " d="M540 480 V520"/><path class="link " d="M540 600 V640"/><text class="edge-label" text-anchor="middle" x="625" y="625">真实产物</text><path class="link " d="M540 720 V760"/><text class="edge-label" text-anchor="middle" x="600" y="746">通过</text><path class="link " d="M540 840 V900"/><text class="edge-label" text-anchor="middle" x="646" y="876">全部 accepted</text><path class="link branch" d="M400 680 H320"/><text class="edge-label" text-anchor="middle" x="360" y="668">失败</text><path class="link back" d="M180 640 V560 H400"/><text class="edge-label" text-anchor="middle" x="258" y="548">未超限且进程已确认停止</text><path class="link branch" d="M180 720 V780"/><text class="edge-label" text-anchor="middle" x="264" y="756">超限 / 无候选</text><path class="link branch" d="M800 560 H680"/><text class="edge-label" text-anchor="middle" x="875" y="508">检查点 / 指导 / 停止</text><path class="link back" d="M680 800 H740 V572 Q756 560 740 548 V500 H540 V520"/><text class="edge-label" text-anchor="middle" x="848" y="785">下一模块 / 集成</text><g class="node " id="flow-request"><title>control-plane.mjs:1300–1310</title><rect x="400" y="40" width="280" height="80" rx="12"/><text x="540" y="72" text-anchor="middle" class="title">描述系统需求并决定委派</text><text x="540" y="97" text-anchor="middle" class="detail">主循环通过 delegate 创建子会话</text></g><g class="node gate" id="flow-authorize"><title>control-plane.mjs:1286–1305</title><rect x="400" y="160" width="280" height="80" rx="12"/><text x="540" y="192" text-anchor="middle" class="title">核对员工、授权与验收脚本</text><text x="540" y="217" text-anchor="middle" class="detail">缺配置则检查项目并请求明确持续授权</text></g><g class="node " id="flow-contract"><title>src/architecture.ts:49–77</title><rect x="400" y="280" width="280" height="80" rx="12"/><text x="540" y="312" text-anchor="middle" class="title">先确定统一架构与契约</text><text x="540" y="337" text-anchor="middle" class="detail">模块边界、依赖、接口 schema、数据与验收</text></g><g class="node " id="flow-route"><title>src/scheduling.ts:141–205</title><rect x="400" y="400" width="280" height="80" rx="12"/><text x="540" y="432" text-anchor="middle" class="title">能力门槛、难度与成本路由</text><text x="540" y="457" text-anchor="middle" class="detail">工作量预估 + 声明费率；未知费用保持未知</text></g><g class="node " id="flow-worker"><title>src/task-scheduler.mjs:3–29; control-plane.mjs:488–505</title><rect x="400" y="520" width="280" height="80" rx="12"/><text x="540" y="552" text-anchor="middle" class="title">DAG 队列 → CLI 工作区执行</text><text x="540" y="577" text-anchor="middle" class="detail">前置 accepted、授权、额度与并发均通过</text></g><g class="node gate" id="flow-quality"><title>src/autonomy.ts:110–132</title><rect x="400" y="640" width="280" height="80" rx="12"/><text x="540" y="672" text-anchor="middle" class="title">实际测试 + ApiX 代码自审</text><text x="540" y="697" text-anchor="middle" class="detail">检查代码边界、指纹、测试证据与审查结果</text></g><g class="node done" id="flow-accepted"><title>src/code-handoffs.mjs:50–62</title><rect x="400" y="760" width="280" height="80" rx="12"/><text x="540" y="792" text-anchor="middle" class="title">accepted：冻结交付版本</text><text x="540" y="817" text-anchor="middle" class="detail">解锁下游模块与 integration 集成任务</text></g><g class="node done" id="flow-delivered"><title>src/autonomy.ts:169; control-plane.mjs:1312</title><rect x="400" y="900" width="280" height="80" rx="12"/><text x="540" y="932" text-anchor="middle" class="title">全部任务含集成均已验收</text><text x="540" y="957" text-anchor="middle" class="detail">返回 delegation_result；主循环再决定答复</text></g><g class="node " id="flow-repair"><title>src/autonomy.ts:91–108</title><rect x="40" y="640" width="280" height="80" rx="12"/><text x="180" y="672" text-anchor="middle" class="title">明确修复任务 / 合格候选改派</text><text x="180" y="697" text-anchor="middle" class="detail">保留原契约；重新执行与验证</text></g><g class="node wait" id="flow-watch"><title>src/autonomy.ts:155–166</title><rect x="800" y="520" width="280" height="80" rx="12"/><text x="940" y="552" text-anchor="middle" class="title">独立持续监督</text><text x="940" y="577" text-anchor="middle" class="detail">风险检查点、阻塞、失联与运行超时</text></g><g class="node error" id="flow-stop"><title>src/autonomy.ts:93,99,150</title><rect x="40" y="780" width="280" height="80" rx="12"/><text x="180" y="812" text-anchor="middle" class="title">attention：暂停等待处理</text><text x="180" y="837" text-anchor="middle" class="detail">返工超限、无合格员工或状态不确定</text></g><text class="foot" x="40" y="1044">默认自主交付：最多修复 2 次、目标 120 分钟、员工 30 分钟；检查点基准 5 分钟，高风险减半、低风险加倍。</text><text class="foot" x="40" y="1064">监督 tick 默认 15 秒；状态未知需人工检查。右侧线桥表示跨线、不连接。</text><text class="foot" x="40" y="1084">交付位于托管 Git 工作区；未自动等同合并原分支、推送 GitHub、创建 PR 或部署。</text></svg>