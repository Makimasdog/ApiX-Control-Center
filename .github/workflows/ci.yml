name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
      - run: npm ci
      - run: npm run check
      - name: Tests with outer deadline and retained diagnostics
        timeout-minutes: 35
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .tmp-ci | Out-Null
          npm test 2>&1 | Tee-Object -FilePath .tmp-ci/npm-test.log
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-diagnostics
          path: .tmp-ci/npm-test.log
          if-no-files-found: ignore
